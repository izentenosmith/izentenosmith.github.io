<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="alternate" type="application/rss+xml" title="Ignacio Zenteno Smith — Blog" href="/rss.xml" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- head:start -->
    <!-- head:end -->
    <script>
      // Set the site theme and mode before first paint so neither flashes.
      // Keys and values match src/components/theme/theme-context.ts.
      try {
        const root = document.documentElement
        if (localStorage.getItem('site-theme') === 'old-money') root.dataset.theme = 'old-money'
        const mode = localStorage.getItem('theme')
        const dark = mode ? mode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        root.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
